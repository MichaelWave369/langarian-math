name: Import Langarian Source

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.head_ref == 'review/langarian-workbench-v0.3-rc1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/langarian-workbench-v0.3-rc1
          fetch-depth: 0

      - name: Reconstruct and verify accepted source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .langarian-import/part-* | base64 -d > /tmp/langarian-src.tar.xz
          echo "ddc2d09e9b25ad27c80481b30ded8100d56bd203e3d7ac34209b744aeba4ff27  /tmp/langarian-src.tar.xz" | sha256sum -c -
          rm -rf /tmp/langarian-src
          mkdir -p /tmp/langarian-src
          tar -xJf /tmp/langarian-src.tar.xz -C /tmp/langarian-src

      - name: Replace staging tree with accepted source
        shell: bash
        run: |
          set -euo pipefail
          if [ -f docs/ORI_ACCEPTANCE.md ]; then
            cp docs/ORI_ACCEPTANCE.md /tmp/ORI_ACCEPTANCE.md
          fi
          rm -rf /tmp/langarian-src/.github
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name .langarian-import -exec rm -rf {} +
          cp -a /tmp/langarian-src/. .
          if [ -f /tmp/ORI_ACCEPTANCE.md ]; then
            cp /tmp/ORI_ACCEPTANCE.md docs/ORI_ACCEPTANCE.md
          fi
          rm -rf .langarian-import

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Langarian Math Workbench v0.3 RC1 source"
          git push origin HEAD:review/langarian-workbench-v0.3-rc1
