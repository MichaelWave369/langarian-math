name: Sync v0.3.1 lockfile version

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'ori/governance-gates-v0.3.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ori/governance-gates-v0.3.1
          fetch-depth: 0
      - name: Sync root package-lock version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('web/package-lock.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          payload['version'] = '0.3.1-rc.1'
          payload['packages']['']['version'] = '0.3.1-rc.1'
          path.write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit lockfile version
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- web/package-lock.json; then
            echo 'Lockfile version already synchronized.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          git commit -m "Sync package-lock version for v0.3.1"
          git push origin HEAD:ori/governance-gates-v0.3.1
