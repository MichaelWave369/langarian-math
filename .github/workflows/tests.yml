name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run tests
        run: pytest -q
      - name: Check fixture determinism
        id: fixtures
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=src python -m langarian.fixtures --out /tmp/langarian-fixtures
          diff -ru fixtures/conformance /tmp/langarian-fixtures | tee /tmp/fixture-diff.txt
      - name: Upload fixture diagnostic
        if: failure() && steps.fixtures.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: fixture-diff-py${{ matrix.python-version }}
          path: /tmp/fixture-diff.txt
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: web
        run: npm ci
      - name: Sync kernel version
        working-directory: web
        run: npm run sync:version
      - name: Unit tests
        id: web-unit
        working-directory: web
        shell: bash
        run: |
          set -o pipefail
          npm run test 2>&1 | tee /tmp/web-unit.log
      - name: Upload web unit diagnostic
        if: failure() && steps.web-unit.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: web-unit-log
          path: /tmp/web-unit.log
          if-no-files-found: error
      - name: Python/TS conformance
        working-directory: web
        run: npm run test:conformance
      - name: Build
        working-directory: web
        run: npm run build
      - name: Audit (high severity)
        working-directory: web
        # Audit runs against the official npm registry; mirrors may not
        # implement the /-/npm/v1/security/* audit endpoints.
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org
