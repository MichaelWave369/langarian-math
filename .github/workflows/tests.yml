name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run tests
        run: pytest -q
      - name: Check fixture determinism
        run: |
          PYTHONPATH=src python -m langarian.fixtures --out /tmp/langarian-fixtures
          diff -r fixtures/conformance /tmp/langarian-fixtures

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: web
        run: npm ci
      - name: Sync kernel version
        working-directory: web
        run: npm run sync:version
      - name: Unit tests
        working-directory: web
        run: npm run test
      - name: Python/TS conformance
        working-directory: web
        run: npm run test:conformance
      - name: Build
        working-directory: web
        run: npm run build
      - name: Audit (high severity)
        working-directory: web
        # Audit runs against the official npm registry; mirrors may not
        # implement the /-/npm/v1/security/* audit endpoints.
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org
