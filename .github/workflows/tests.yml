name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run tests
        run: pytest -q

  fixture-regeneration-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install reference numerical environment
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install --force-reinstall "numpy==2.3.5"
      - name: Regenerate fixture diagnostic
        id: fixtures
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m langarian.fixtures --out /tmp/langarian-fixtures
          if diff -ru fixtures/conformance /tmp/langarian-fixtures > /tmp/fixture-diff.txt; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "Fixtures regenerated byte-identically on this runner."
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=Platform-dependent fixture drift::The committed fixtures remain canonical. Review the uploaded least-significant-bit diff before any intentional fixture refresh."
            cat /tmp/fixture-diff.txt
          fi
      - name: Upload platform-drift diagnostic
        if: steps.fixtures.outputs.drift == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fixture-platform-drift
          path: /tmp/fixture-diff.txt
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install development dependencies
        working-directory: web
        run: npm ci --include=dev --registry=https://registry.npmjs.org
      - name: Sync kernel version
        working-directory: web
        run: npm run sync:version
      - name: Unit tests
        id: web-unit
        working-directory: web
        shell: bash
        run: |
          set -o pipefail
          npm run test 2>&1 | tee /tmp/web-unit.log
      - name: Upload web unit diagnostic
        if: failure() && steps.web-unit.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: web-unit-log
          path: /tmp/web-unit.log
          if-no-files-found: error
      - name: Python/TS conformance
        working-directory: web
        run: npm run test:conformance
      - name: Build
        working-directory: web
        run: npm run build
      - name: Audit (high severity)
        working-directory: web
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org
      - name: Build evidence custody directory
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: web
        run: npm run build:custody -- /tmp/evidence-custody
      - name: Archive evidence custody directory
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: tar -C /tmp -czf "/tmp/langarian-evidence-custody-${GITHUB_SHA}.tar.gz" evidence-custody
      - name: Upload evidence custody archive
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: langarian-evidence-custody-${{ github.sha }}
          path: /tmp/langarian-evidence-custody-${{ github.sha }}.tar.gz
          if-no-files-found: error
      - name: Attest evidence custody archive
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: /tmp/langarian-evidence-custody-${{ github.sha }}.tar.gz
