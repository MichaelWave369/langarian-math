name: Sync v0.3.1 test expectation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'ori/governance-gates-v0.3.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ori/governance-gates-v0.3.1
          fetch-depth: 0
      - name: Update product-version expectation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_hardening.py')
          text = path.read_text(encoding='utf-8')
          old = '"product_version": "0.3.0-rc.1"'
          new = '"product_version": "0.3.1-rc.1"'
          if old not in text:
              raise SystemExit('expected old product-version assertion not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit expectation update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_hardening.py
          git commit -m "Update v0.3.1 product-version test expectation"
          git push origin HEAD:ori/governance-gates-v0.3.1
