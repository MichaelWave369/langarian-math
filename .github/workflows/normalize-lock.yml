name: Normalize npm lockfile

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: github.head_ref == 'review/langarian-workbench-v0.3-rc1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/langarian-workbench-v0.3-rc1
          fetch-depth: 0
      - name: Replace private mirror URLs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('web/package-lock.json')
          text = path.read_text(encoding='utf-8')
          old = 'https://npm.mirrors.msh.team/'
          new = 'https://registry.npmjs.org/'
          count = text.count(old)
          if count == 0:
              print('No private mirror URLs remain.')
          else:
              path.write_text(text.replace(old, new), encoding='utf-8')
              print(f'Replaced {count} private mirror URLs.')
          PY
      - name: Commit normalized lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- web/package-lock.json; then
            echo 'Lockfile already normalized.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          git commit -m "Normalize npm lockfile registry URLs"
          git push origin HEAD:review/langarian-workbench-v0.3-rc1
